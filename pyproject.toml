[project]
name = "eccovox"
version = "0.1.0"
description = "Independent local voice runtime for speech transcription and text-to-speech synthesis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "RodrigoGML" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "typer>=0.15.0",
  "python-multipart>=0.0.20"
]

[project.optional-dependencies]
dev = [
  "httpx2>=0.28.0",
  "pytest>=8.0.0"
]
stt = [
  "faster-whisper>=1.1.0"
]
tts = [
  "kokoro>=0.9.4",
  "soundfile>=0.12.1"
]
voice = [
  "faster-whisper>=1.1.0",
  "kokoro>=0.9.4",
  "soundfile>=0.12.1"
]

[project.scripts]
eccovox = "eccovox.cli:main"

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
